name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & type check
    # Fail fast instead of GitHub's 6-hour default if something hangs.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy app alembic/env.py tests

  test:
    name: Tests (PostGIS + Redis)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carepoint
          POSTGRES_PASSWORD: carepoint
          POSTGRES_DB: carepoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carepoint -d carepoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://carepoint:carepoint@localhost:5432/carepoint
      TEST_DATABASE_URL: postgresql+asyncpg://carepoint:carepoint@localhost:5432/carepoint_test
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Create test database
        env:
          PGPASSWORD: carepoint
        run: psql -h localhost -U carepoint -d carepoint -c "CREATE DATABASE carepoint_test"
      - name: Apply migrations
        run: alembic upgrade head
      - name: pytest
        run: pytest -v

  simulator:
    name: Hardware simulator
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: hardware_sim/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy carepoint_sim tests scripts
      - name: pytest
        run: pytest -v

  kiosk:
    name: Kiosk (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hardware_sim/kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hardware_sim/kiosk/package-lock.json
      - run: npm ci
      - name: Type check (strict) and build
        run: npm run build

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type check (strict) and build
        run: npm run build

  mobile:
    name: Mobile (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Generated API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/services/api-types.ts \
            || { echo "::error::src/services/api-types.ts is stale: run npm run gen:api"; exit 1; }
      - name: Type check (strict)
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Jest
        run: npm test -- --ci

  docker:
    name: Docker Compose smoke test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack (waits for all healthchecks, incl. backend /ready)
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Probe endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          echo
          curl --fail --silent --show-error http://localhost:8000/ready
          echo
      - name: Seed demo data twice (second run must create nothing)
        run: |
          docker compose exec -T backend python -m app.scripts.seed
          docker compose exec -T backend python -m app.scripts.seed | tee second-run.txt
          if grep -E "created +[1-9]" second-run.txt; then
            echo "::error::seed is not idempotent"; exit 1
          fi
      - name: All simulated machines come online
        run: |
          for _ in $(seq 1 30); do
            online=$(curl -fsS 'http://localhost:8000/api/v1/machines/nearby?lat=44.44&lng=26.08&radius_m=20000' \
              | python3 -c 'import json, sys; print(sum(m["online"] for m in json.load(sys.stdin)))')
            echo "online: $online of 6"
            [ "$online" -eq 6 ] && exit 0
            sleep 2
          done
          echo "::error::the simulated machines did not all come online"; exit 1
      - name: Pickup through a simulated machine (pay in the API, enter the code at the kiosk)
        run: python3 hardware_sim/scripts/pickup_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright (Chromium)
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Drive the kiosk in a browser (code on the keypad, item dispensed, stock down)
        working-directory: e2e
        run: node kiosk-smoke.mjs
      - name: Drive the operator dashboard (customer refused, restock, live feed, offline on simulator stop)
        working-directory: e2e
        run: node dashboard-smoke.mjs
      - name: Upload screenshots (kiosk and dashboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore
      - name: pytest inside backend container
        run: docker compose exec -T -e REQUIRE_SERVICES=1 backend pytest -p no:cacheprovider -q
      # Last, because it restarts the backend with 40 s holds so the story's
      # expiry half takes under a minute (ADR-030).
      - name: The whole MVP story (the app's API calls, kiosk in a browser, expiry; recorded)
        run: |
          RESERVATION_HOLD_SECONDS=40 docker compose up -d --wait backend
          cd e2e && STORY_VIDEO=1 node story.mjs
      - name: Upload the story video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-video
          path: e2e/artifacts/story-video/
          if-no-files-found: ignore
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  automerge:
    name: Auto-merge
    timeout-minutes: 5
    needs: [lint, test, simulator, kiosk, dashboard, mobile, docker]
    # Same-repo PRs only (never forks), not drafts, and not labelled do-not-merge.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --match-head-commit: refuse to merge if new commits landed after this CI run started.
        run: >-
          gh pr merge "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --merge
          --delete-branch
          --match-head-commit "$HEAD_SHA"
