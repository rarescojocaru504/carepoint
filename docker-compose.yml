name: carepoint

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carepoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carepoint}
      POSTGRES_DB: ${POSTGRES_DB:-carepoint}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Apply pending migrations before serving traffic.
    # --timeout-keep-alive 75: longer than typical load-balancer idle timeouts
    # (60 s), so the server never closes a connection a client is about to reuse
    # (uvicorn's 5 s default caused sporadic "server disconnected" errors under
    # load). Worker processes: WEB_CONCURRENCY (read by uvicorn), default 1.
    # --ws websockets: fail at startup if the WebSocket library is missing instead
    # of silently serving without the machine gateway; --ws-max-size caps a frame
    # before it is buffered (the gateway itself allows 16 KiB, ADR-017).
    # DEMO_INIT=1 (the default here): seed the demo data and issue the demo
    # machines' keys for the hardware simulator before serving (ADR-019).
    command: >-
      sh -c "alembic upgrade head &&
             if [ \"$${DEMO_INIT}\" = 1 ]; then
               python -m app.scripts.demo_init --keys-dir /var/lib/carepoint/machine-keys;
             fi &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 75
             --ws websockets --ws-max-size 65536"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-carepoint}:${POSTGRES_PASSWORD:-carepoint}@db:5432/${POSTGRES_DB:-carepoint}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-carepoint}:${POSTGRES_PASSWORD:-carepoint}@db:5432/${POSTGRES_DB:-carepoint}_test
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DEMO_INIT: ${DEMO_INIT:-1}
      # How long a reservation holds stock. Set 60 to show an expiry on stage:
      #   RESERVATION_HOLD_SECONDS=60 docker compose up --wait   (or put it in .env)
      RESERVATION_HOLD_SECONDS: ${RESERVATION_HOLD_SECONDS:-900}
    volumes:
      - machine_keys:/var/lib/carepoint/machine-keys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Plays the six demo machines against the backend and serves their kiosk
  # screens on http://localhost:8080 (docs/machine-protocol.md, ADR-019).
  simulator:
    build:
      context: ./hardware_sim
    restart: unless-stopped
    environment:
      SIM_BACKEND_URL: ws://backend:8000
      SIM_HTTP_HOST: 0.0.0.0
    volumes:
      - machine_keys:/var/lib/carepoint/machine-keys:ro
      - simulator_state:/var/lib/carepoint-sim/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/machines', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  # Operator dashboard on http://localhost:3000 (ADR-023); nginx also proxies /api.
  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  machine_keys:
  simulator_state:
